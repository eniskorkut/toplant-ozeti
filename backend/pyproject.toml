[project]
name = "meeting-intelligence-backend"
version = "0.1.0"
description = "Backend for the Meeting Intelligence web application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "python-multipart",
    "numpy",
    "soundfile",
    # Pinned deliberately. This dependency is validated in the Linux container,
    # not on the host. 1.13.8 fails there: its manylinux wheels do not bundle
    # libonnxruntime.so ("libonnxruntime.so: cannot open shared object file").
    # 1.10.46 is the newest release whose Linux wheels are self-contained.
    # See README "Known issues".
    "sherpa-onnx==1.10.46",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real-model end-to-end test (deselected by default; run with -m integration)",
]
addopts = "-m 'not integration'"
